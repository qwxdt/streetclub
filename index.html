<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f0f0d">
<title>Street Club — стритвир с доставкой по Украине</title>
<link rel="preload" href="fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="img/p1039.webp" as="image">
<style>
@font-face{font-family:Mont;font-weight:400 800;font-display:swap;src:url(fonts/mont-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Mont;font-weight:400 800;font-display:swap;src:url(fonts/mont-cyrillic-ext.woff2) format('woff2');unicode-range:U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F}
@font-face{font-family:Mont;font-weight:400 800;font-display:swap;src:url(fonts/mont-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:SSerif;font-weight:700;font-display:swap;src:url(fonts/ss-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:SSerif;font-weight:700;font-display:swap;src:url(fonts/ss-cyrillic-ext.woff2) format('woff2');unicode-range:U+0460-052F,U+20B4}
@font-face{font-family:SSerif;font-weight:700;font-display:swap;src:url(fonts/ss-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+2122,U+2212}

:root{
  --bg:#fff;--panel:#fff;--panel2:#f4f4f4;--line:#e9e9e9;
  --ink:#111;--mut:#7a7a7a;--acc:#111;--acc-ink:#fff;--err:#c8321f;
  --st:#2f7d3a;--or:#b0610f;--paper:#f2f2f2;
  --pad:14px;--hh:60px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hh) + 52px);-webkit-text-size-adjust:100%}
html.lock,html.lock body{overflow:hidden}
body{background:var(--bg);color:var(--ink);font:500 14px/1.45 Mont,system-ui,sans-serif;min-width:320px;overflow-x:hidden}
img{display:block;max-width:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.nw{white-space:nowrap}
.wrap{width:100%;max-width:1320px;margin:0 auto;padding:0 var(--pad)}
.ser{font-family:SSerif,Georgia,serif;font-weight:700}

/* top strip + header */
.strip{background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:600;text-align:center;padding:7px 10px;line-height:1.3}
.strip a{text-decoration:underline;text-underline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .bar{height:var(--hh);display:flex;align-items:center;gap:10px}
.logo{display:grid;place-items:center;width:52px;height:52px;border:1.5px solid var(--ink);font:700 12.5px/1 SSerif,Georgia,serif;text-align:center;letter-spacing:.01em;flex:none}
.logo span{display:block}
.brandtx{font-weight:600;font-size:12px;line-height:1.15;margin-right:auto;color:var(--ink)}
.brandtx b{display:block;font-weight:700}
.nav{display:none}
.lang{display:flex;align-items:center;gap:2px;flex:none;font-size:12px}
.lang button{height:36px;padding:0 5px;font-weight:600;color:var(--mut)}
.lang button[aria-pressed=true]{color:var(--ink);font-weight:800;text-decoration:underline;text-underline-offset:4px}
.cartb{height:40px;padding:0 4px 0 6px;color:var(--ink);font-weight:700;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;position:relative}
.cartb svg{width:24px;height:24px}
.cartb b{position:absolute;top:2px;left:20px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:10.5px;line-height:17px;text-align:center}
.cartb .cl{display:none}
.menu{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;align-items:center;white-space:nowrap;padding:10px 0}
.menu::-webkit-scrollbar{display:none}
.menu button{height:36px;padding:0 15px;border:1px solid var(--line);border-radius:18px;font-weight:600;font-size:13px;color:var(--ink);transition:background .2s,border-color .2s,color .2s}
.menu button:hover{border-color:var(--ink)}
.menu button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}


/* === v3: strip, header, nav === */
.strip{background:#111;color:#fff;font-size:11px;font-weight:600;letter-spacing:.02em;text-align:center;padding:8px 12px;line-height:1.3}
.top{transition:box-shadow .25s}
.top.sc{box-shadow:0 1px 0 var(--line),0 8px 24px rgba(0,0,0,.05);border-bottom-color:transparent}
.top .bar{display:grid;grid-template-columns:1fr auto 1fr;gap:8px}
.burg{width:42px;height:42px;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 9px;justify-self:start}
.burg i{display:block;height:2px;background:var(--ink);border-radius:2px;transition:transform .3s,opacity .2s}
.burg i:nth-child(2){width:70%}
.wm{font:700 19px/1 SSerif,Georgia,serif;letter-spacing:.06em;white-space:nowrap;color:var(--ink)}
.top .wm{justify-self:center}
.rt{justify-self:end;display:flex;align-items:center;gap:4px}
.rt .lang{display:none}
.dnav{display:none}
.mega{display:none}
.nav{position:fixed;inset:0 auto 0 0;width:min(420px,100%);z-index:45;background:#fff;transform:translateX(-102%);visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s .45s;display:flex;flex-direction:column;overscroll-behavior:contain}
.nav.on{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.nav-h{height:var(--hh);display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 var(--pad);border-bottom:1px solid var(--line);flex:none}
.nav-x{width:44px;height:44px;display:grid;place-items:center}.nav-x svg{width:22px;height:22px}
.nav-b{overflow-y:auto;padding:18px var(--pad) calc(24px + env(safe-area-inset-bottom));flex:1;display:flex;flex-direction:column}
.nav-k{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
.nav-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nt{position:relative;display:block;text-align:left;background:var(--paper);aspect-ratio:1/1.05;overflow:hidden;border-radius:4px;opacity:0;transform:translateY(14px);transition:opacity .4s,transform .4s}
.nav.on .nt{opacity:1;transform:none}
.nt img{position:absolute;inset:6% 6% 22%;width:88%;height:72%;object-fit:contain;mix-blend-mode:multiply}
.nt span{position:absolute;left:10px;right:10px;bottom:9px;font-weight:700;font-size:13px;line-height:1.2}
.nav-links{margin-top:18px;border-top:1px solid var(--line)}
.nav-links>*{display:flex;align-items:center;justify-content:space-between;width:100%;height:54px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;text-align:left}
.nav-links svg{width:18px;height:18px}
.nav-f{margin-top:auto;padding-top:22px;display:flex;align-items:center;justify-content:space-between}
.nav-tg{font-size:13px;color:var(--mut);font-weight:600}
.scrim.nv{z-index:44}

/* === hero slider === */
.hs{position:relative;overflow:hidden;background:#f4f4f2}
.hs-tr{display:flex;transition:transform .8s cubic-bezier(.65,0,.25,1);touch-action:pan-y}
.sl{flex:0 0 100%;min-width:0;position:relative}
.s1{background:#f3f2ef}.s2{background:#ecebe8}.s3{background:#111;color:#fff}
.sl-in{display:flex;flex-direction:column;min-height:min(640px,calc(100svh - 130px));padding-top:24px;padding-bottom:52px}
.sl-tx{position:relative;z-index:2}
.sl-k{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;opacity:.6}
.sl h2{font:800 clamp(34px,10.4vw,84px)/.95 Mont,sans-serif;letter-spacing:-.035em;text-transform:uppercase;max-width:9ch}
.sl p{margin-top:12px;font-size:14px;line-height:1.45;max-width:30ch;opacity:.75}
.sl-b{margin-top:18px;display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 20px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;border-radius:23px;transition:gap .25s}
.sl-b svg{width:18px;height:18px}
.sl-b:hover{gap:16px}
.s3 .sl-b{background:#fff;color:#111}
.sl-ph{position:relative;flex:1;min-height:min(78vw,340px);margin-top:14px}
.sl-ph img{position:absolute;height:auto;aspect-ratio:1/1;object-fit:contain;mix-blend-mode:multiply;transition:transform 1.1s cubic-bezier(.2,.8,.2,1),opacity .9s}
.sl-ph .b{width:min(80%,460px);left:50%;margin-left:calc(min(80%,460px) / -2);bottom:0;z-index:2}
.sl-ph .a{width:min(56%,330px);left:-6%;bottom:14%;transform-origin:bottom}
.sl-ph .c{width:min(56%,330px);right:-6%;bottom:12%}
.sl .sl-ph img{opacity:0}
.sl .sl-ph .a{transform:translate(30%,8%) rotate(0deg)}
.sl .sl-ph .c{transform:translate(-30%,8%) rotate(0deg)}
.sl .sl-ph .b{transform:translateY(10%)}
.sl.on .sl-ph img{opacity:1}
.sl.on .sl-ph .a{transform:rotate(-9deg);transition-delay:.15s}
.sl.on .sl-ph .c{transform:rotate(8deg);transition-delay:.2s}
.sl.on .sl-ph .b{transform:none;transition-delay:.05s}
.s3 .sl-ph img{mix-blend-mode:normal;background:#fff;border-radius:6px;padding:4%;box-shadow:0 20px 40px rgba(0,0,0,.35)}
.s3 .sl-ph .b{width:min(50%,300px);margin-left:calc(min(50%,300px) / -2);bottom:6%}
.s3 .sl-ph .a,.s3 .sl-ph .c{width:42%}
.sl-tx>*{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .7s cubic-bezier(.2,.8,.2,1)}
.sl.on .sl-tx>*{opacity:1;transform:none}
.sl.on .sl-tx>*:nth-child(2){transition-delay:.08s}.sl.on .sl-tx>*:nth-child(3){transition-delay:.16s}.sl.on .sl-tx>*:nth-child(4){transition-delay:.24s}
.hs-nav{position:absolute;left:0;right:0;bottom:20px;z-index:3;pointer-events:none}
.hs-dots{display:flex;gap:6px;pointer-events:auto}
.hs-dots button{width:34px;height:20px;display:flex;align-items:center}
.hs-dots i{display:block;width:100%;height:3px;background:rgba(0,0,0,.15);border-radius:2px;overflow:hidden;position:relative}
.hs-dots i::after{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left}
.hs-dots button.on i::after{animation:hsbar 5.5s linear forwards}
.hs.dk .hs-dots i{background:rgba(255,255,255,.25)}.hs.dk .hs-dots i::after{background:#fff}
.hs.paused .hs-dots button.on i::after{animation-play-state:paused}
@keyframes hsbar{to{transform:scaleX(1)}}

/* === category tiles === */
.cats{padding:34px 0 6px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h h2{font:800 22px/1.1 Mont,sans-serif;letter-spacing:-.02em}
.sec-a{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;white-space:nowrap}
.sec-a svg{width:16px;height:16px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile img,.nt img{height:auto}
.tile{position:relative;display:block;width:100%;text-align:left;background:var(--paper);aspect-ratio:1/1.12;overflow:hidden;border-radius:4px}
.tile img{position:absolute;left:8%;top:5%;width:84%;height:74%;object-fit:contain;mix-blend-mode:multiply;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.tile:hover img{transform:scale(1.06) translateY(-2%)}
.tile .tl{position:absolute;left:12px;right:12px;bottom:11px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.tile b{font-weight:800;font-size:15px;line-height:1.15}
.tile small{display:block;font-size:11.5px;color:var(--mut);font-weight:600;margin-top:2px}
.tile .go{flex:none;width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;transition:background .2s,color .2s}
.tile .go svg{width:15px;height:15px}
.tile:hover .go{background:var(--ink);color:#fff}
.tile.big{grid-column:1/-1;aspect-ratio:2/1.15}
.tile.big img{left:auto;right:4%;width:58%;height:88%;top:6%}
.tile.big .tl{right:auto;top:16px;bottom:auto;display:block}
.tile.big b{font-size:24px;letter-spacing:-.02em}
.tile.big .go{margin-top:12px}

/* catalog tabs sticky under header */
.tabs-w{position:sticky;top:var(--hh);z-index:15;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-bottom:16px}
.cat{padding-top:20px}
.cat-h{display:flex;align-items:baseline;gap:10px;text-align:left}
.cat-h span{color:var(--mut);font-size:13px;font-weight:600}
.card .ph{border-radius:4px;background:var(--paper)}
.card .ph img{object-fit:contain;mix-blend-mode:multiply;padding:6%}
.card{padding-bottom:4px}
.card .t{margin:10px 2px 0}
.card .p{margin-left:2px!important;margin-right:2px!important}
.sh-ph img,.ci .ph img,.coi .ph img{mix-blend-mode:multiply;object-fit:contain}
.adv{border-top:1px solid var(--line);padding:30px 0 34px}

/* advantages */
.adv{padding:26px 0 8px}
.adv .wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}
.adv .it{text-align:center}
.adv svg{width:40px;height:40px;margin:0 auto 8px;display:block}
.adv b{display:block;font-weight:700;font-size:13.5px;line-height:1.25}
.adv span{display:block;color:var(--mut);font-size:12.5px;margin-top:4px;line-height:1.35}

/* catalog */
.cat{padding:28px 0 48px}
.cat-h{text-align:center;margin-bottom:16px}
.cat-h h2{font-weight:800;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 10px}
.card{display:block;text-align:left;width:100%;min-width:0;background:var(--panel);padding:0 0 12px}
.card .ph{aspect-ratio:1/1;background:var(--paper);overflow:hidden;border-radius:4px}
.card .ph img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;padding:6%;transition:transform .35s}
.card:hover .ph img{transform:scale(1.04)}
.card .t{margin:10px 2px 0;font-weight:500;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.card .p{margin:6px 2px 0;font-weight:800;font-size:15px;white-space:nowrap}

/* footer */
.foot{background:var(--ink);color:var(--bg);padding:36px 0 28px}
.foot .logo{border-color:var(--bg);width:64px;height:64px;font-size:15px}
.foot h2{font-weight:800;font-size:18px;margin-top:22px}
.foot p{margin-top:6px;color:#bdb6aa;max-width:30em}
.cts{display:flex;flex-direction:column;gap:8px;margin-top:18px;max-width:420px}
.cts a{display:flex;align-items:center;justify-content:space-between;gap:12px;height:48px;padding:0 16px;border:1px solid #3a3833;font-weight:700;white-space:nowrap}
.cts a span:last-child{color:#bdb6aa;font-weight:500;font-size:13px}
.cts a:hover{border-color:var(--bg)}
.foot .wm{display:none}

/* overlays */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(20,20,20,.45);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.scrim.on{opacity:1;visibility:visible;transition:opacity .25s}
.sheet,.drawer{position:fixed;z-index:31;background:var(--bg);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;overscroll-behavior:contain}
.sheet.on,.drawer.on{visibility:visible;transform:none;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet{left:0;right:0;bottom:0;top:0;transform:translateY(calc(100% + 40px));overflow-y:auto}
.xb{position:absolute;top:10px;right:10px;z-index:3;width:42px;height:42px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center}
.xb svg{width:18px;height:18px}
.sh-ph{aspect-ratio:1/1;background:var(--paper);overflow:hidden}
.sh-ph img{width:100%;height:100%;object-fit:cover}
.sh-b{padding:16px var(--pad) 0}
.sh-b h3{font-weight:700;font-size:19px;line-height:1.25}
.sh-b .ty{color:var(--mut);margin-top:2px;font-size:13px}
.sh-b .pr{font-weight:800;font-size:24px;margin-top:12px;white-space:nowrap}
.lbl{font-weight:700;font-size:13px;margin:18px 0 8px;display:flex;justify-content:space-between;gap:10px}
.lbl .er{color:var(--err);font-weight:600}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.sizes button{min-width:52px;height:44px;padding:0 12px;border:1px solid #cfc7b8;background:var(--panel);font-weight:600;white-space:nowrap}
.sizes button:hover{border-color:var(--ink)}
.sizes button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.sizes.bad button{border-color:var(--err)}
.avail{padding:0}
.avail .row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);background:var(--panel)}
.avail .row+.row{border-top:0}
.avail .row.off{opacity:.42}
.avail .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid currentColor;flex:none;margin-top:2px;display:grid;place-items:center}
.avail .row.on .dot::after{content:'';width:8px;height:8px;border-radius:50%;background:currentColor}
.avail .st{color:var(--st)}.avail .or{color:var(--or)}
.avail .l1{font-weight:700;color:var(--ink)}
.avail .l1 em{font-style:normal;font-weight:700}
.avail .l2{color:var(--mut);font-size:12.5px;margin-top:2px}
.sh-add{position:sticky;bottom:0;padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom));margin-top:18px;background:var(--bg);border-top:1px solid var(--line)}
.sh-add .btn{width:100%}
.perks{padding:4px var(--pad) 24px;display:grid;gap:10px}
.perks div{display:flex;gap:10px;align-items:center;font-size:12.5px;font-weight:600}
.perks svg{width:26px;height:26px;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 24px;background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:15px;white-space:nowrap;transition:background .15s,transform .15s}
.btn:hover{background:#333}.btn:active{transform:scale(.99)}
.btn.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--bg)}
.btn[disabled]{background:#cfc9be;color:#8a847a;cursor:not-allowed;transform:none}

.drawer{top:0;right:0;bottom:0;width:100%;max-width:440px;transform:translateX(calc(100% + 40px));display:flex;flex-direction:column}
.dh{display:flex;align-items:center;justify-content:space-between;height:var(--hh);padding:0 6px 0 var(--pad);border-bottom:1px solid var(--line);flex:none}
.dh h3{font-weight:800;font-size:18px}
.dh .xb{position:static}
.dl{flex:1;overflow-y:auto;padding:4px var(--pad)}
.ci{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.ci .ph{width:76px;aspect-ratio:1/1;background:var(--paper);overflow:hidden}
.ci .ph img{width:100%;height:100%;object-fit:cover}
.ci .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .m{color:var(--mut);font-size:12.5px;margin-top:2px}
.ci .m b{color:var(--ink);font-weight:700}
.ci .m .st{color:var(--st);font-weight:700}.ci .m .or{color:var(--or);font-weight:700}
.ci .r{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.ci .r span{font-weight:800;white-space:nowrap}
.ci .rm{font-size:12.5px;color:var(--mut);text-decoration:underline;padding:8px 0}
.empty{padding:48px 0;text-align:center;color:var(--mut)}
.empty .btn{margin-top:18px}
.df{flex:none;padding:14px var(--pad) calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.df .tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin-bottom:12px}
.df .btn{width:100%}

/* checkout */

.fld{display:block;margin-bottom:12px}

.fld input{width:100%;height:50px;padding:0 14px;border:1px solid #cfc7b8;background:var(--panel);font-size:16px;border-radius:0}
.fld input:focus{outline:0;border-color:var(--ink)}
.fld.bad input{border-color:var(--err)}
.fld em{display:none;font-style:normal;color:var(--err);font-size:12.5px;margin-top:4px;font-weight:600}

.two{display:grid;gap:0 12px}

var CAT_OF={hoodie:'hood',zip:'hood',knit:'knit',crew:'knit',long:'tee',tee:'tee',polo:'tee',pants:'pants',jeans:'pants',jacket:'outer',biker:'outer',cross:'acc',xbelt:'acc'};
function cardTitle(it){var ty=t('t_'+it.ty);ty=ty.charAt(0).toUpperCase()+ty.slice(1);return it.b?ty+' '+it.b:ty}
function renderGrid(){
  $('#catH').textContent=t('c_'+filter);var cn=$('#catN');if(cn)cn.textContent=words(countOf(filter));
  $('#grid').innerHTML=ITEMS.filter(function(i){return filter==='new'||CAT_OF[i.ty]===filter}).map(function(i){
    return '<button type="button" class="card" data-open="'+i.id+'"><div class="ph"><img src="img/p'+i.id+'.webp" width="720" height="720" loading="lazy" alt="'+esc(title(i)+' · '+sub(i))+'"></div>'
     +'<div class="t">'+esc(cardTitle(i))+'</div>'
     +'<div class="p">'+money(kop(i.p))+'</div></button>'}).join('');
}
function availHTML(it){
  var d='<span class="nw">'+dateOf(it)+'</span>';
  if(it.m==='st')return '<div class="row on st"><span class="dot"></span><div><div class="l1">'+t('av_st1')+'</div><div class="l2">'+t('av_st2',{d:d})+'</div></div></div>';
  return '<div class="row on or"><span class="dot"></span><div><div class="l1">'+t('av_or1',{n:ORDER_LEAD})+'</div><div class="l2">'+t('av_or2',{d:d,p:PREPAY_PCT})+'</div></div></div>';
}

/* ---------- шторка товара ---------- */
function openItem(id){
  var it=BY[id];if(!it)return;curItem=it;curSize=null;
  $('#shImg').src='img/p'+it.id+'.webp';$('#shImg').alt=title(it)+' · '+sub(it);
  renderSheet();
  show('#sheet');$('#shX').focus({preventScroll:true});
}
function renderSheet(){
  var it=curItem;if(!it)return;
  $('#shT').textContent=cardTitle(it);$('#shTy').textContent='';$('#shPr').textContent=money(kop(it.p));
  var sz=sizesOf(it);
  $('#shSz').className='sizes';$('#shEr').textContent='';
  $('#shSz').innerHTML=sz.map(function(s){return '<button type="button" data-sz="'+s+'" aria-pressed="'+(curSize===s)+'">'+esc(sizeLbl(s))+'</button>'}).join('');
  $('#shAv').innerHTML=availHTML(it);
  $('#shAdd').textContent=t('add')+' · '+money(kop(it.p));
}
function addToCart(){
  if(!curSize){$('#shSz').classList.add('bad');$('#shEr').textContent=t('pick_size');return}
  var dup=cart.some(function(c){return c.id===curItem.id&&c.size===curSize});
  if(dup){toast(t('in_cart'));return}
  cart.push({id:curItem.id,size:curSize});save();renderCartBtn();
  hide('#sheet');renderCart();show('#drawer');
}

/* ---------- корзина ---------- */
function renderCartBtn(){$('#cartN').textContent=cart.length}
function metaLine(c){var it=BY[c.id];
  return '<b>'+esc(sizeLbl(c.size))+'</b> · <span class="'+(it.m==='st'?'st':'or')+'">'+t(it.m==='st'?'ci_stock':'ci_order',{d:'<span class="nw">'+dateOf(it)+'</span>'})+'</span>'}
function totalKop(){return cart.reduce(function(a,c){return a+kop(BY[c.id].p)},0)}
function renderCart(){
  var L=$('#drL');
  if(!cart.length){L.innerHTML='<div class="empty"><div>'+t('empty')+'</div><button class="btn" type="button" data-close="1">'+t('to_cat')+'</button></div>';$('#drF').style.display='none';return}
  $('#drF').style.display='';
  L.innerHTML=cart.map(function(c,i){var it=BY[c.id];
    return '<div class="ci"><div class="ph"><img src="img/p'+it.id+'.webp" alt="" width="720" height="720"></div><div style="min-width:0"><div class="n">'+esc(title(it))+(it.b?' · '+esc(sub(it)):'')+'</div><div class="m">'+metaLine(c)+'</div><div class="r"><button class="rm" type="button" data-rm="'+i+'">'+t('remove')+'</button><span>'+money(kop(it.p))+'</span></div></div></div>'}).join('');
  $('#drTot').textContent=money(totalKop());
}

/* ---------- оформление ---------- */
function hasOrder(){return cart.some(function(c){return BY[c.id].m==='or'})}
function calc(){
  var st=0,orr=0,orPre=0;
  cart.forEach(function(c){var k=kop(BY[c.id].p);if(BY[c.id].m==='st')st+=k;else{orr+=k;orPre+=pre(k)}});
  var tot=st+orr,now=(pay==='card'?st:0)+orPre;
  return {tot:tot,now:now,later:tot-now,st:st,orr:orr}}
function renderCo(){
  $('#coItems').innerHTML=cart.map(function(c){var it=BY[c.id];
    return '<div class="coi"><div class="ph"><img src="img/p'+it.id+'.webp" alt="" width="720" height="720"></div><div style="min-width:0"><div class="n">'+esc(title(it))+(it.b?' · '+esc(sub(it)):'')+'</div><div class="m">'+metaLine(c)+'</div></div><div class="pp">'+money(kop(it.p))+'</div></div>'}).join('');
  var ord=hasOrder(),hasSt=cart.some(function(c){return BY[c.id].m==='st'});
  $('#orderBox').style.display=ord?'':'none';
  var n=[];
  if(hasSt)n.push(t(pay==='card'?'pn_card':'pn_cod'));
  if(ord)n.push(t('pn_ord',{p:PREPAY_PCT}));
  $('#payNote').textContent=n.join(' ');
  var k=calc();
  $('#sT').textContent=money(k.tot);$('#sNow').textContent=money(k.now);$('#sLater').textContent=money(k.later);
  $('#coGo').disabled=ord&&!$('#ack').checked;
}
function openCo(){
  if(!cart.length)return;
  hide('#drawer',true);finished=null;$('#co').classList.remove('fin');
  $('#ack').checked=false;$('#ackL').classList.remove('bad');
  renderCo();$('#co').classList.add('on');lockOn();$('#co').scrollTop=0;
}
function phoneFmt(v){
  var d=v.replace(/\D/g,'');
  if(d.indexOf('380')===0)d=d.slice(3);else if(d.indexOf('38')===0)d=d.slice(2);else if(d.charAt(0)==='0')d=d.slice(1);
  if(d.charAt(0)==='0')d=d.slice(1);
  d=d.slice(0,9);if(!d&&!/\d/.test(v))return '';
  var s='+380';if(d.length)s+=' ('+d.slice(0,2);if(d.length>=2)s+=')';
  if(d.length>2)s+=' '+d.slice(2,5);if(d.length>5)s+='-'+d.slice(5,7);if(d.length>7)s+='-'+d.slice(7,9);
  return s}
function phoneDigits(v){return v.replace(/\D/g,'').length}
function validate(){
  var ok=true,first=null;
  function chk(id,good){var f=$('#'+id);f.classList.toggle('bad',!good);if(!good){ok=false;if(!first)first=f}}
  chk('fN',$('#iN').value.trim().length>=2);
  chk('fP',phoneDigits($('#iP').value)===12);
  chk('fC',$('#iC').value.trim().length>=2);
  chk('fB',/\d/.test($('#iB').value));
  if(hasOrder()&&!$('#ack').checked){$('#ackL').classList.add('bad');ok=false;if(!first)first=$('#ackL')}
  if(first)first.scrollIntoView({block:'center',behavior:'auto'});
  return ok}
function orderText(no,v){
  var k=calc(),L=[];
  L.push(t('o_h',{n:no}));
  L.push(t('o_name')+': '+v.name);L.push(t('o_phone')+': '+v.phone);
  L.push(t('o_ship')+': '+t('o_np',{c:v.city,b:v.branch}));
  L.push(t('o_pay')+': '+t(pay==='card'?'o_card':'o_cod'));
  L.push('');L.push(t('o_items')+':');
  cart.forEach(function(c,i){var it=BY[c.id];
    L.push((i+1)+'. '+title(it)+(it.b?' · '+sub(it):'')+', '+sizeLbl(c.size)+' — '+(it.m==='st'?t('o_stock',{d:dateOf(it)}):t('o_order',{n:ORDER_LEAD,d:dateOf(it)}))+' — '+money(kop(it.p)))});
  L.push('');L.push(t('o_total')+': '+money(k.tot));L.push(t('o_now')+': '+money(k.now));L.push(t('o_later')+': '+money(k.later));
  if(hasOrder()){L.push('');L.push(t('o_ack',{n:ORDER_LEAD}))}
  return L.join('\n')}
function confirm(){
  if(hasOrder()&&!$('#ack').checked)return;
  if(!validate())return;
  var b=baseDate(),no='SC-'+String(b.m+1).padStart(2,'0')+String(b.d).padStart(2,'0')+'-'+String(1000+Math.floor(Math.random()*9000));
  finished={no:no,v:{name:$('#iN').value.trim(),phone:$('#iP').value,city:$('#iC').value.trim(),branch:$('#iB').value.trim()},pay:pay,cart:cart.slice()};
  renderDone();$('#co').classList.add('fin');$('#co').scrollTop=0;
  cart=[];save();renderCartBtn();
}
function renderDone(){
  if(!finished)return;
  var saveCart=cart,savePay=pay;cart=finished.cart;pay=finished.pay;
  var txt=orderText(finished.no,finished.v);
  cart=saveCart;pay=savePay;
  $('#doneNo').textContent=t('done_no',{n:finished.no});
  $('#doneTxt').textContent=txt;
  $('#tgBtn').href='https://t.me/'+TG+'?text='+encodeURIComponent(txt);
}

/* ---------- слои ---------- */
var layers=[];
function lockOn(){document.documentElement.classList.add('lock')}
function lockOff(){if(!document.querySelector('.sheet.on,.drawer.on,.co.on,.nav.on'))document.documentElement.classList.remove('lock');
  if(!document.querySelector('.sheet.on,.drawer.on,.nav.on'))$('#scrim').classList.remove('on','nv')}
function show(sel){var e=$(sel);e.classList.add('on');$('#scrim').classList.add('on');lockOn()}
function hide(sel,keepScrim){var e=$(sel);e.classList.remove('on');
  if(!keepScrim&&!document.querySelector('.sheet.on,.drawer.on,.nav.on'))$('#scrim').classList.remove('on','nv');lockOff()}
function closeAll(){hide('#sheet');hide('#drawer');
  if($('#co').classList.contains('on')){$('#co').classList.remove('on')}
  $('#scrim').classList.remove('on');lockOff()}
var tt;function toast(m){var e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){e.classList.remove('on')},2200)}

/* ---------- события ---------- */
document.addEventListener('click',function(e){
  var o=e.target.closest('[data-open]');
  if(o){e.preventDefault();openItem(+o.dataset.open);return}
  var sz=e.target.closest('[data-sz]');
  if(sz){curSize=sz.dataset.sz;$('#shSz').classList.remove('bad');$('#shEr').textContent='';$$('#shSz button').forEach(function(b){b.setAttribute('aria-pressed',b===sz)});return}
  var rm=e.target.closest('[data-rm]');
  if(rm){cart.splice(+rm.dataset.rm,1);save();renderCartBtn();renderCart();return}
  if(e.target.closest('[data-close]')){hide('#drawer');return}
  var f=e.target.closest('[data-f]');
  if(f){filter=f.dataset.f;$$('#menu button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.f===filter)});renderGrid();$('#catalog').scrollIntoView({behavior:'smooth'});return}
  var bn=e.target.closest('[data-cat]');
  if(bn){e.preventDefault();filter=bn.dataset.cat;$$('#menu button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.f===filter)});renderGrid();$('#catalog').scrollIntoView({behavior:'smooth'});return}
  var l=e.target.closest('.lang button');
  if(l){lang=l.dataset.l;try{localStorage.setItem('sc_lang',lang)}catch(x){}rerender();return}
});
$('#scrim').addEventListener('click',function(){hide('#sheet');hide('#drawer')});
$('#shX').addEventListener('click',function(){hide('#sheet')});
$('#shAdd').addEventListener('click',addToCart);
$('#cartBtn').addEventListener('click',function(){renderCart();show('#drawer')});
$('#drX').addEventListener('click',function(){hide('#drawer')});
$('#drGo').addEventListener('click',openCo);
$('#coBack').addEventListener('click',function(){
  $('#co').classList.remove('on');lockOff();
  if(!$('#co').classList.contains('fin')){renderCart();show('#drawer')}else{$('#co').classList.remove('fin')}
});
$('#toCat').addEventListener('click',function(){$('#co').classList.remove('on','fin');lockOff();$('#iN').value='';$('#iP').value='';$('#iC').value='';$('#iB').value='';$$('.fld').forEach(function(f){f.classList.remove('bad')});location.hash='';$('#catalog').scrollIntoView()});
$('#ack').addEventListener('change',function(){$('#ackL').classList.remove('bad');renderCo()});
$$('input[name=pay]').forEach(function(r){r.addEventListener('change',function(){pay=r.value;renderCo()})});
$('#coGo').addEventListener('click',confirm);
$('#iP').addEventListener('input',function(){var v=this.value;if(v.length<this.dataset.prev.length&&!/\d$/.test(v)){}this.value=phoneFmt(v);this.dataset.prev=this.value;$('#fP').classList.remove('bad')});
$('#iP').dataset.prev='';
$('#iP').addEventListener('focus',function(){if(!this.value){this.value='+380 (';this.dataset.prev=this.value}});
$('#iP').addEventListener('blur',function(){if(phoneDigits(this.value)<=3)this.value=''});
['iN','iC','iB'].forEach(function(id){$('#'+id).addEventListener('input',function(){this.parentNode.classList.remove('bad')})});
$('#cpBtn').addEventListener('click',function(){
  var txt=$('#doneTxt').textContent,b=this;
  function ok(){var o=b.textContent;b.textContent=t('copied');setTimeout(function(){b.textContent=t('copy')},1600)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,function(){})}
  else{var r=document.createRange();r.selectNodeContents($('#doneTxt'));var s=getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand('copy');ok()}catch(x){}}
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if($('#co').classList.contains('on')){$('#coBack').click();return}
  if($('#drawer').classList.contains('on')){hide('#drawer');return}
  if($('#sheet').classList.contains('on'))hide('#sheet')});


/* ---------- v3: разделы, меню, слайдер ---------- */
var TILE_IMG={new:1053,hood:1034,knit:1001,tee:990,pants:916,outer:938,acc:1030};
var ARW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
function countOf(c){return ITEMS.filter(function(i){return c==='new'||CAT_OF[i.ty]===c}).length}
function words(n){var a=n%10,b=n%100;return n+' '+t(a===1&&b!==11?'w1':(a>=2&&a<=4&&(b<10||b>=20))?'w2':'w5')}
function renderNavs(){
  $('#tiles').innerHTML=CATS.map(function(c){return '<button type="button" class="tile'+(c==='new'?' big':'')+'" data-f="'+c+'"><img src="img/p'+TILE_IMG[c]+'.webp" alt="" width="720" height="720" loading="lazy"><span class="tl"><span><b>'+t(c==='new'?'all_items':'c_'+c)+'</b><small>'+words(countOf(c))+'</small></span><span class="go">'+ARW+'</span></span></button>'}).join('');
  var small=CATS.filter(function(c){return c!=='new'});
  var nt=function(c,i){return '<button type="button" class="nt" data-f="'+c+'" style="transition-delay:'+(0.06+i*0.04)+'s"><img src="img/p'+TILE_IMG[c]+'.webp" alt="" width="720" height="720" loading="lazy"><span>'+t('c_'+c)+'</span></button>'};
  $('#navTiles').innerHTML=small.map(nt).join('');
  $('#megaIn').innerHTML=small.map(nt).join('');
  $('#dnav').innerHTML='<button type="button" data-f="new" data-mega>'+t('catalog')+'</button>'+['hood','knit','pants','outer'].map(function(c){return '<button type="button" data-f="'+c+'">'+t('c_'+c)+'</button>'}).join('')+'<button type="button" onclick="document.getElementById(\'contacts\').scrollIntoView()">'+t('contacts')+'</button>';
  var n=$('#catN');if(n)n.textContent=words(countOf(filter));
}
function openNav(){$('#nav').classList.add('on');$('#nav').setAttribute('aria-hidden','false');$('#burg').setAttribute('aria-expanded','true');$('#scrim').classList.add('on','nv');lockOn()}
function closeNav(){if(!$('#nav').classList.contains('on'))return;$('#nav').classList.remove('on');$('#nav').setAttribute('aria-hidden','true');$('#burg').setAttribute('aria-expanded','false');lockOff()}
$('#burg').addEventListener('click',openNav);
$('#navX').addEventListener('click',closeNav);
$('#nav').addEventListener('click',function(e){if(e.target.closest('[data-f],[data-navclose],a'))closeNav()},true);
/* мега-меню на ПК */
(function(){var hdr=$('#hdr'),mega=$('#mega'),tm;
  function on(){clearTimeout(tm);mega.classList.add('on');var b=$('#dnav [data-mega]');if(b)b.classList.add('hov')}
  function off(){tm=setTimeout(function(){mega.classList.remove('on');var b=$('#dnav [data-mega]');if(b)b.classList.remove('hov')},140)}
  $('#dnav').addEventListener('mouseover',function(e){if(e.target.closest('[data-mega]'))on();else if(e.target.closest('button'))off()});
  mega.addEventListener('mouseenter',on);mega.addEventListener('mouseleave',off);
  hdr.addEventListener('mouseleave',off);
  mega.addEventListener('click',function(e){if(e.target.closest('[data-f]')){mega.classList.remove('on')}});
})();
/* тень шапки */
addEventListener('scroll',function(){$('#hdr').classList.toggle('sc',scrollY>8)},{passive:true});
/* слайдер */
(function(){var hs=$('#hs'),tr=$('#hsTr'),sl=$$('.sl'),dots=$$('#hsDots button'),i=0,tm,N=sl.length,RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function go(n){i=(n+N)%N;tr.style.transform='translateX('+(-i*100)+'%)';
    sl.forEach(function(s,k){s.classList.toggle('on',k===i)});
    dots.forEach(function(d,k){d.classList.remove('on');if(k===i){void d.offsetWidth;d.classList.add('on')}});
    hs.classList.toggle('dk',i===2);plan()}
  function plan(){clearTimeout(tm);if(!RM)tm=setTimeout(function(){go(i+1)},5500)}
  dots.forEach(function(d,k){d.addEventListener('click',function(){go(k)})});
  var x0=null,y0=0;
  tr.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  tr.addEventListener('touchend',function(e){if(x0==null)return;var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))go(i+(dx<0?1:-1))});
  hs.addEventListener('mouseenter',function(){clearTimeout(tm);hs.classList.add('paused')});
  hs.addEventListener('mouseleave',function(){hs.classList.remove('paused');plan()});
  document.addEventListener('visibilitychange',function(){if(document.hidden)clearTimeout(tm);else plan()});
  window.__hsGo=go;
  requestAnimationFrame(function(){go(0)});
})();

/* ---------- старт ---------- */
function rerender(){
  applyStatic();renderNavs();renderGrid();renderCartBtn();renderCart();
  if(curItem){var s=curSize;renderSheet();curSize=s;$$('#shSz button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.sz===s)})}
  renderCo();if(finished)renderDone();
  $('#toast').classList.remove('on');
  $('#cpBtn').textContent=t('copy');
}
rerender();
window.__sc={D:D,ITEMS:ITEMS,calc:calc,pre:pre};
})();
</script>
